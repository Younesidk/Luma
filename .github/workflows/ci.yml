name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # version tags are handled by release.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore Luma.sln

      - name: Build (Release)
        run: dotnet build Luma.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test Luma.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal" --results-directory TestResults

      # Unpackaged WinUI 3 apps can build fine yet publish broken (e.g. without Luma.pri, the compiled XAML).
      # publish.ps1 checks the self-contained win-x64 output, so CI catches that before a release does.
      - name: Publish smoke check (unpackaged WinUI 3, win-x64, self-contained)
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue
          if (-not $trx) { "### Tests`nNo test results were produced." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          foreach ($f in $trx) {
            $c = ([xml](Get-Content $f.FullName)).TestRun.ResultSummary.Counters
            "### Tests`nTotal **$($c.total)** - passed **$($c.passed)** - failed **$($c.failed)** - not executed **$($c.notExecuted)**" >> $env:GITHUB_STEP_SUMMARY
          }

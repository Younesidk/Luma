name: Release

# Runs only for version tags such as v1.0.0 or v1.2.0-beta.1 (a hyphen marks a pre-release).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Minimum needed: read the code, create the release and upload its assets.
permissions:
  contents: write

# Never run two releases at once (delta chains depend on order); never cancel one half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, package and publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to check the tag is on main

      - name: Validate tag, version and release state
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag '$tag' is not a version tag like v1.2.3." }
          $tagVersion = $Matches[1]

          $props = [xml](Get-Content Directory.Build.props)
          $propsVersion = ($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($propsVersion -ne $tagVersion) {
            throw "Tag '$tag' says $tagVersion but Directory.Build.props <Version> is '$propsVersion'. Fix the version, commit, and re-tag."
          }

          git fetch origin main --quiet
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag '$tag' points to a commit that is not on main. Release only from main." }

          # `gh release view` cannot see drafts, so list every release (drafts included) and look for the tag.
          $all = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases." }
          $clash = @($all | Where-Object { $_.tag_name -eq $tag -or $_.name -eq "Luma $tagVersion" })
          if ($clash.Count -gt 0) {
            $d = ($clash | ForEach-Object { "id=$($_.id) tag='$($_.tag_name)' name='$($_.name)' draft=$($_.draft)" }) -join '; '
            throw "A release for $tag already exists ($d). Delete it on GitHub before retrying; this workflow never reuses or merges into an existing release."
          }
          $untagged = @($all | Where-Object { $_.draft -and -not $_.tag_name })
          if ($untagged.Count -gt 0) { Write-Host "::notice::$($untagged.Count) untagged draft release(s) exist; they are ignored and left untouched." }

          $pre = if ($tagVersion -match '-') { 'true' } else { 'false' }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path "release-notes/$tagVersion.md")) { Write-Host "::warning::release-notes/$tagVersion.md not found; the update card will have no notes." }
          Write-Host "Releasing $tagVersion (prerelease=$pre)"

      - name: Set up .NET SDK (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore Luma.sln

      - name: Build (Release)
        run: dotnet build Luma.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test Luma.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Package with Velopack (existing script)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # lets vpk download the previous release for delta generation
        run: ./scripts/build-installer.ps1

      - name: Verify release files
        shell: pwsh
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          $required = @("Luma.Desktop-win-Setup.exe", "Luma.Desktop-$v-full.nupkg", "releases.win.json", "assets.win.json")
          $missing = $required | Where-Object { -not (Test-Path "Releases/$_") }
          if ($missing) { throw "Missing release files: $($missing -join ', ')" }
          if (-not (Test-Path "Releases/Luma.Desktop-$v-delta.nupkg")) {
            Write-Host "::notice::No delta package (normal for the first release); installed copies will use the full package."
          }
          Get-ChildItem Releases | Format-Table Name, Length

      - name: Keep a copy of the release files
        uses: actions/upload-artifact@v4
        with:
          name: velopack-release-${{ steps.meta.outputs.version }}
          path: Releases/
          retention-days: 30

      - name: Upload to a DRAFT release (not published yet)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          # No --publish (draft) and no --merge (never merge into an existing release).
          $vpkArgs = @(
            "vpk", "upload", "github",
            "--repoUrl", "https://github.com/$env:GITHUB_REPOSITORY",
            "--channel", "win",
            "--outputDir", "Releases",
            "--tag", "v$v",
            "--targetCommitish", $env:GITHUB_SHA,
            "--releaseName", "Luma $v",
            "--token", $env:GITHUB_TOKEN
          )
          if ("${{ steps.meta.outputs.prerelease }}" -eq "true") { $vpkArgs += "--pre" }
          & dotnet @vpkArgs
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed (any partial draft is left on GitHub; nothing was published)." }

      - name: Verify the draft has exactly the required assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          $tag = "v$v"

          # Expected = what was built locally for this version. Previous-version packages that were downloaded for
          # delta generation are NOT part of this release.
          # Required (installed copies cannot install/update without them):
          #   Setup.exe, the full package, releases.win.json (the feed Velopack clients read), and the delta
          #   package whenever vpk built one. Optional extras vpk also uploads (allowed, never blocking):
          #   the portable zip and the legacy RELEASES file (only read by old Squirrel/Velopack clients; Luma has none).
          $required = [ordered]@{}
          $manifest = Get-Content Releases/assets.win.json -Raw | ConvertFrom-Json
          foreach ($m in $manifest) {
            if ($m.Type -in "Installer", "Full", "Delta") { $required[$m.RelativeFileName] = (Get-Item "Releases/$($m.RelativeFileName)" -ErrorAction Stop).Length }
          }
          foreach ($n in "Luma.Desktop-win-Setup.exe", "Luma.Desktop-$v-full.nupkg") {
            if (-not $required.Contains($n)) { throw "Required file '$n' is not in assets.win.json." }
          }
          $optional = @("Luma.Desktop-win-Portable.zip", "RELEASES")
          $feedName = "releases.win.json"

          $all = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $rel = @($all | Where-Object { $_.tag_name -eq $tag })
          if ($rel.Count -ne 1) { throw "Expected exactly one release for $tag, found $($rel.Count)." }
          $rel = $rel[0]
          if (-not $rel.draft) { throw "Release $tag is not a draft; refusing to continue." }
          $expectPre = "${{ steps.meta.outputs.prerelease }}" -eq "true"
          if ($rel.prerelease -ne $expectPre) { throw "Draft pre-release flag is $($rel.prerelease), expected $expectPre." }

          $problems = @()
          $remote = @{}
          foreach ($a in $rel.assets) { $remote[$a.name] = $a }
          foreach ($n in $required.Keys) {
            if (-not $remote.ContainsKey($n)) { $problems += "MISSING: $n"; continue }
            $a = $remote[$n]
            if ($a.state -ne "uploaded") { $problems += "NOT FULLY UPLOADED: $n (state=$($a.state))" }
            elseif ($a.size -ne $required[$n]) { $problems += "SIZE MISMATCH: $n (remote $($a.size), local $($required[$n]))" }
          }
          # Optional extras: if present they must be fully uploaded, but their absence never blocks.
          foreach ($n in $optional) {
            if ($remote.ContainsKey($n) -and $remote[$n].state -ne "uploaded") { $problems += "NOT FULLY UPLOADED: $n" }
            if (-not $remote.ContainsKey($n)) { Write-Host "::notice::Optional asset $n is not on the draft (not blocking)." }
          }
          foreach ($n in $remote.Keys) {
            if (-not ($required.Contains($n) -or $optional -contains $n -or $n -eq $feedName)) { $problems += "UNEXPECTED: $n" }
          }

          # The feed: must exist, and its CONTENT must describe this release (vpk regenerates it at upload time,
          # so compare entries and hashes rather than file size).
          if (-not $remote.ContainsKey($feedName)) { $problems += "MISSING: $feedName" }
          else {
            $feedFile = Join-Path $env:RUNNER_TEMP "feed-check.json"
            gh api -H "Accept: application/octet-stream" "repos/$env:GITHUB_REPOSITORY/releases/assets/$($remote[$feedName].id)" > $feedFile
            if ($LASTEXITCODE -ne 0) { $problems += "Could not download $feedName from the draft" }
            else {
              $feed = (Get-Content $feedFile -Raw | ConvertFrom-Json).Assets
              foreach ($n in $required.Keys | Where-Object { $_ -like "*.nupkg" }) {
                $entry = @($feed | Where-Object { $_.FileName -eq $n })
                $sha = (Get-FileHash "Releases/$n" -Algorithm SHA256).Hash
                if ($entry.Count -ne 1) { $problems += "FEED: $feedName has no entry for $n" }
                elseif ($entry[0].SHA256 -ne $sha) { $problems += "FEED: SHA256 of $n differs from the built package" }
                elseif ($entry[0].Version -ne $v) { $problems += "FEED: $n is listed as version $($entry[0].Version), expected $v" }
              }
            }
          }

          "### Draft $tag (id $($rel.id))" >> $env:GITHUB_STEP_SUMMARY
          foreach ($n in $remote.Keys | Sort-Object) { "- $n" >> $env:GITHUB_STEP_SUMMARY }
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            "**Verification FAILED - the release was left as a draft:**`n$($problems -join "`n")" >> $env:GITHUB_STEP_SUMMARY
            throw "Draft verification failed; release $tag stays a draft."
          }
          Write-Host "Draft $tag verified: $($remote.Count) assets."
          "release_id=$($rel.id)" >> $env:GITHUB_OUTPUT
        id: verify

      - name: Publish the verified draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.meta.outputs.version }}"
          $expectPre = "${{ steps.meta.outputs.prerelease }}" -eq "true"
          # Publish by release id (the verified draft), keeping the pre-release flag as built.
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/${{ steps.verify.outputs.release_id }}" `
            -F draft=false -F prerelease=$($expectPre.ToString().ToLower()) | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the draft." }
          $r = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease | ConvertFrom-Json
          if ($r.isDraft -or ($r.isPrerelease -ne $expectPre)) { throw "Post-publish check failed: $($r | ConvertTo-Json -Compress)" }
          "### Published $tag (prerelease=$($r.isPrerelease))" >> $env:GITHUB_STEP_SUMMARY
